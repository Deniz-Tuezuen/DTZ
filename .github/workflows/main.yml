name: Webseite fuer IONOS erstellen

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Webseite erstellen
        run: npm run build

      - name: Fertige Webseite bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Webseite-fuer-IONOS
          path: dist/
          if-no-files-found: error
